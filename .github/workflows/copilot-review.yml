# test/03 — push trivial pour valider le ruleset "Automated code reviews on push"
name: Request Copilot Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  request-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request Copilot via JSON body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- tentative 1 : JSON body explicite ---"
          RESPONSE=$(echo '{"reviewers":["Copilot"]}' | gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            --input -)
          echo "$RESPONSE" | jq '.requested_reviewers'

      - name: Request Copilot via gh pr edit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- tentative 2 : gh pr edit --add-reviewer ---"
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --add-reviewer Copilot
