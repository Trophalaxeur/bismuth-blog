name: Claude Full Codebase Review

on:
  workflow_dispatch:

jobs:
  full-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Perform a thorough review of this codebase (bismuth-blog — Astro 6, Tailwind v4, TypeScript).
            Exclude `src/content/` entirely — markdown content files are out of scope.

            Cover:
            - Architecture and project structure consistency
            - TypeScript correctness and type safety
            - Astro component patterns and best practices
            - Tailwind v4 usage correctness
            - Content Layer schema consistency
            - Security issues (XSS, injection, exposed data)
            - Accessibility (a11y) in Astro components
            - Dead code, unused imports, leftover TODOs
            - Anything inconsistent with CLAUDE.md conventions

            Post findings as a GitHub issue titled "Full codebase review — [date]" using `gh issue create`.
            Group findings by severity: Critical / Warning / Suggestion.

          claude_args: |
            --allowedTools "Bash(gh issue create:*),Bash(find . -not -path './src/content/*':*),Read,Bash(grep --exclude-dir=src/content:*)"
