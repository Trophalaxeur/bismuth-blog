name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'src/content/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Ignore all files under `src/content/` — markdown content files are out of scope.

            Review this pull request with a focus on:
            - Code quality and Astro/TypeScript best practices
            - Potential bugs or regressions
            - Security implications
            - Consistency with the project conventions (see CLAUDE.md)

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for inline code annotations.
            Only post GitHub comments — do not output review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
