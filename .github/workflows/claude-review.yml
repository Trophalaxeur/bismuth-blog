name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'src/content/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            1. Read `.github/copilot-instructions.md` — it contains the review rules for this repository.
            2. Read `CLAUDE.md` — it contains the project conventions (stack, naming, commands).
            3. Use `gh pr diff ${{ github.event.pull_request.number }}` to get the list of changed files and their diffs.

            Apply the rules from `.github/copilot-instructions.md` strictly to the changed files only.
            Respect the exclusions defined in those instructions (src/content/, node_modules/, hidden folders).

            Post a single top-level PR comment using:
              gh pr comment ${{ github.event.pull_request.number }} --body "..."

            Follow the output format defined in `.github/copilot-instructions.md` exactly.
            Do not output review text as chat messages — only post the GitHub comment.

          claude_args: |
            --allowedTools "Read,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
